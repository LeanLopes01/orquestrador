[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dicevtt-diagnostics"
version = "0.1.0"
description = "Relatórios automáticos do DiceVTT: coleta local (VCS, Unity, logs, RAG), SQLite e JSON/HTML."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
dicevtt-diagnostics = "dicevtt_diagnostics.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
