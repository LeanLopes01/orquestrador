[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-ingestion"
version = "0.1.0"
description = "Coleta local de documentação (Trafilatura) e legendas (youtube-transcript-api) para o RAG do DiceVTT."
requires-python = ">=3.11"
dependencies = [
  "trafilatura>=1.9",
  "youtube-transcript-api>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
rag-ingestion = "rag_ingestion.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
