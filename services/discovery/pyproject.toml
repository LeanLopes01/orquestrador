[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-discovery"
version = "0.1.0"
description = "Descoberta automática de fontes para o RAG do DiceVTT: código C#, índices oficiais e tópicos do AirLLM."
requires-python = ">=3.11"
# Reaproveita a ingestão (URLs, lock) e o RAG (configs, embeddings, AirLLM) do mesmo .venv-rag.
dependencies = [
  "rag-ingestion",
  "unity-rag",
  "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rag-discovery = "rag_discovery.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
